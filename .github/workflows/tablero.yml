# Regenera el tablero y lo publica, sin depender de que la PC este prendida.
#
# La tarea programada local solo corre con la aplicacion abierta: el 24/08 se
# saltearon unas 14 actualizaciones por eso. Esto corre en la infraestructura de
# GitHub, asi que el tablero se mantiene fresco aunque la maquina este apagada.
#
# Los horarios van en UTC. La rueda de Nueva York (9:30-16:00 ET) y la de Buenos
# Aires (11:00-17:00 ART) caen juntas entre las 13:00 y las 21:00 UTC.

name: Tablero tecnico

on:
  schedule:
    # Cada 15 minutos durante la rueda, de lunes a viernes.
    - cron: "*/15 13-21 * * 1-5"
    # Una corrida al cierre, con las velas del dia ya cerradas.
    - cron: "20 21 * * 1-5"
  workflow_dispatch:        # permite correrlo a mano desde la pestana Actions

# Una sola corrida a la vez: si una se demora, la siguiente espera en vez de
# pisarla y dejar la rama en un estado raro.
concurrency:
  group: tablero
  cancel-in-progress: false

permissions:
  contents: write           # para empujar la rama de publicacion

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      - name: Generar el tablero
        run: python publicar.py --archivo
        env:
          PYTHONIOENCODING: utf-8

      - name: Comprobar que el tablero salio entero
        # Si Yahoo falla o devuelve poco, mejor no publicar: la version anterior
        # sigue siendo valida y es preferible a uno vacio o a medias.
        run: |
          ARCHIVO=salidas/tablero-para-compartir.html
          test -f "$ARCHIVO" || { echo "No se genero el archivo"; exit 1; }
          PESO=$(stat -c%s "$ARCHIVO")
          echo "Peso: $((PESO/1024)) KB"
          test "$PESO" -gt 1000000 || { echo "Archivo sospechosamente chico"; exit 1; }
          grep -q '"activos"' "$ARCHIVO" || { echo "Sin datos de activos"; exit 1; }

      - name: Publicar en la rama de la pagina
        run: |
          set -e
          ARCHIVO=salidas/tablero-para-compartir.html
          # Rama huerfana con un unico commit: la pagina pesa 3,4 MB y se
          # publica decenas de veces por dia; acumulando commits el repo
          # crecería cerca de un giga por mes.
          rm -rf .publicacion && mkdir .publicacion
          cp "$ARCHIVO" .publicacion/index.html
          touch .publicacion/.nojekyll
          cd .publicacion
          git init -q -b pagina
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Tablero tecnico $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            pagina

      - name: Resumen
        run: |
          echo "Publicado en https://${{ github.repository_owner }}.github.io/tablero-tecnico/" >> $GITHUB_STEP_SUMMARY
          echo "Generado: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
