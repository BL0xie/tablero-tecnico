# Perfil base: valores por defecto que heredan todos los demas escenarios.
# Los otros perfiles solo declaran lo que cambian (extiende: base).
# No hace falta tocar este archivo para crear un escenario nuevo.

nombre: base
descripcion: Configuracion estandar diaria, parametros clasicos.

# Temporalidades a analizar. Yahoo limita el intradiario:
#   1m -> 7 dias | 5m/15m/30m -> 60 dias | 60m -> 2 anios | 1d/1wk/1mo -> sin limite
temporalidades: [1d]

# Cuanto pesa cada temporalidad en el consenso (mas alto = mas influencia).
pesos_temporalidad:
  60m: 3
  1d: 6
  1wk: 8

min_velas: 60             # minimo para que las medias largas tengan sentido
peso_osciladores: 0.5     # 0 = solo medias/tendencia, 1 = solo osciladores/momentum
usar_volumen: true
velas_senal: 3            # cuantas velas atras se consideran "senal reciente"

parametros:
  # --- osciladores ---
  rsi: 14
  rsi_sobreventa: 30
  rsi_sobrecompra: 70
  macd_rapida: 12
  macd_lenta: 26
  macd_senal: 9
  estocastico_k: 14
  estocastico_d: 3
  estocastico_suave: 3
  cci: 20
  adx: 14
  adx_umbral: 20
  williams: 14
  momentum: 10
  mfi: 14

  # --- medias moviles ---
  medias: [10, 20, 30, 50, 100, 200]   # las que votan en el resumen tecnico
  medias_clave: [20, 50, 200]          # las que generan senal al perderse/recuperarse
  medias_pullback: [20, 50]            # donde buscar entradas de retroceso
  cruce_rapida: 20                     # cruce de medias: la rapida
  cruce_lenta: 50                      # cruce de medias: la lenta
  tendencia: 50                        # media que define el sesgo de fondo

  # --- volatilidad y volumen ---
  atr: 14
  bollinger: 20
  bollinger_desv: 2.0
  donchian: 20
  volumen_media: 20
  volumen_alto: 1.5                    # multiplo del promedio que confirma el movimiento
  ventana_swing: 5
  lookback_divergencia: 40

# Como se detectan soportes y resistencias.
niveles:
  ventana_swing: 5          # velas a cada lado para validar un pivote
  tolerancia_atr: 0.5       # que tan cerca deben estar dos toques para ser la misma zona
  fusion_atr: 0.35          # que tan cerca deben estar dos niveles para fusionarse
  metodo_pivote: clasico    # clasico | fibonacci | camarilla
  pivotes_semanales: true
  lookback_fibo: 120
  medias_soporte: [20, 50, 200]
  n_bollinger: 20
  desv_bollinger: 2.0
  n_donchian: 20

# Reglas de riesgo: es lo que mas cambia entre escenarios.
riesgo:
  modo_stop: porcentaje     # porcentaje | atr | estructura | combinado
  stop_pct: 7.0
  stop_atr: 2.0             # se usa si modo_stop = atr o combinado
  colchon_estructura_atr: 0.35
  min_stop_atr: 1.2         # por debajo de esto se avisa que el stop es muy ajustado

  modo_objetivo: porcentaje # porcentaje | rr | nivel
  objetivo_pct: 14.0
  objetivo_rr: 2.0
  fuerza_estorbo: 60        # resistencia con esta fuerza antes del objetivo genera aviso

  rr_minimo: 1.5
  max_distancia_entrada_pct: 12.0   # ignora zonas mas lejos que esto
  ancho_zona_atr: 0.4               # ancho de la zona de entrada
  confirmacion_ruptura_atr: 0.25    # margen sobre el nivel para dar la ruptura por valida
  max_soportes: 3
  max_resistencias: 2
  permitir_cortos: false            # en Balanz no se opera corto: queda como gestion

  # Tamano de posicion. Poner capital para que lo calcule.
  capital: null
  riesgo_por_operacion_pct: 1.0
  max_posicion_pct: 25.0

# Validacion historica del par stop/objetivo.
backtest:
  activo: true
  max_velas: 20             # horizonte de la operacion, en velas
  min_operaciones: 8        # menos que esto no se reporta: no es significativo

salida:
  html: true
  excel: true
  grafico_velas: 180        # cuantas velas dibujar en el grafico
