# Intradiario / muy corto plazo: velas de 15 minutos con contexto horario.
# Ojo: Yahoo solo guarda 60 dias de velas de 15m, asi que la muestra del
# backtest es chica. Sirve para el dia, no para sacar conclusiones de fondo.

extiende: base
nombre: intradiario
descripcion: Velas de 15m con contexto de 1h. Stop y objetivo ajustados al ruido del dia.

temporalidades: [15m, 60m]
pesos_temporalidad:
  15m: 4
  60m: 6

peso_osciladores: 0.7
velas_senal: 2
min_velas: 100

parametros:
  medias: [9, 20, 50, 100, 200]
  medias_clave: [9, 20, 50]
  medias_pullback: [9, 20]
  cruce_rapida: 9
  cruce_lenta: 20
  tendencia: 50
  rsi: 9                  # RSI mas rapido para intradiario
  rsi_sobreventa: 25
  rsi_sobrecompra: 75
  ventana_swing: 3
  volumen_alto: 2.0       # intradiario necesita mas volumen para confirmar
  donchian: 12

niveles:
  ventana_swing: 3
  tolerancia_atr: 0.4
  lookback_fibo: 60
  medias_soporte: [9, 20, 50]
  n_donchian: 12
  pivotes_semanales: false

riesgo:
  modo_stop: atr          # en intradiario el % fijo no sirve: manda el ruido
  stop_atr: 1.5
  stop_pct: 2.0
  modo_objetivo: rr
  objetivo_rr: 2.0
  objetivo_pct: 4.0
  rr_minimo: 1.5
  max_distancia_entrada_pct: 4.0
  min_stop_atr: 1.0
  permitir_cortos: false
  riesgo_por_operacion_pct: 0.5

backtest:
  activo: true
  max_velas: 16           # ~4 horas en velas de 15m
  min_operaciones: 10
