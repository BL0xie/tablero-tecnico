# Universo de activos que ofrece el tablero para armar la cartera.
#
# Los CEDEARs figuran con el ticker del papel original en dolares (AAPL, no
# AAPL.BA): el CEDEAR en pesos mezcla el movimiento de la accion con el del
# dolar CCL y eso ensucia los indicadores. El movimiento que replica es el de
# aca; los precios hay que pasarlos con el ratio de conversion.
#
# Para agregar un activo: sumar una linea con ticker, nombre y grupo.
# Para sacarlo: borrar la linea. Nada mas.

grupos:
  cedear: CEDEARs
  merval: Acciones argentinas
  cripto: Cripto
  indice: Índices y ETF

activos:
