# Swing de semanas: aguanta mas ruido y busca movimientos mas grandes.
# El stop se calcula por estructura (debajo del soporte real) en vez de un
# porcentaje fijo, porque en plazos mas largos el % fijo salta por ruido.

extiende: base
nombre: swing
descripcion: Swing de 2 a 8 semanas, stop por estructura y objetivo en resistencia.

temporalidades: [1d, 1wk]
pesos_temporalidad:
  1d: 5
  1wk: 8

peso_osciladores: 0.4     # en swing pesa mas la tendencia
velas_senal: 4

parametros:
  medias: [20, 50, 100, 200]
  medias_clave: [50, 200]
  medias_pullback: [20, 50]
  cruce_rapida: 20
  cruce_lenta: 50
  tendencia: 200
  ventana_swing: 7
  lookback_divergencia: 60

niveles:
  ventana_swing: 7
  tolerancia_atr: 0.6
  lookback_fibo: 250
  medias_soporte: [50, 100, 200]
  n_donchian: 55

riesgo:
  modo_stop: combinado      # el mas holgado entre %, ATR y estructura
  stop_pct: 12.0
  stop_atr: 2.5
  modo_objetivo: nivel      # la proxima resistencia real, no un % fijo
  objetivo_pct: 25.0
  rr_minimo: 2.0
  max_distancia_entrada_pct: 15.0
  max_soportes: 4
  permitir_cortos: false
  riesgo_por_operacion_pct: 1.5

backtest:
  activo: true
  max_velas: 40
  min_operaciones: 8
